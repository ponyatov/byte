.end
#!/usr/bin/env shebang
// line comment
/* block comment */

1
1+2


let files = [Makefile .gitignore .clang-format .doxygen .prettierrc]
files.map touch

List.map mkdir .vscode bin doc lib inc src tmp mk cmake vscode mk
touch {.,.vscode,bin,doc,lib,inc,src,tmp,mk,cmake,vscode,mk}/.gitignore

const ABOUT = "byte"
const TITLE = "bytecode compiler"
const AUTHOR = "Dmitry Ponyatov"
const EMAIL = "dponyatov@gmail.com"
const YEAR = 2025
const LICENSE = "MIT"

git remote add gh   git@github.com:ponyatov/byte.git
git remote add flic git@gitflic.ru:dponyatov/byte.git
git push -uv gh `whoami`

touch .vscode/extensions.json
touch .vscode/settings.json
touch .vscode/tasks.json
touch .vscode/c_cpp_properties.json
touch .vscode/launch.json

apt.Debian << "
git make curl
code meld doxygen clang-format
g++ cmake gdb
ragel lemon libreadline-dev
"

mk/install.mk << "
.PHONY: install update
install: doc ref gz
	$(MAKE) update
update:
	sudo apt update
	sudo apt install -uy `cat apt.Debian`
ref: $(REF)
gz:  $(GZ)
"

mkdir cmake
touch CMakeLists.txt CMakePresets.json

touch cmake/any_toolchain.cmake
touch cmake/x86_64-linux-gnu.cmake
touch cmake/arm-none-eabi.cmake
touch cmake/aarch64-linux-gnu.cmake
touch cmake/i686-w64-mingw32.cmake
touch cmake/mingw-w64-ucrt-x86_64.cmake
touch cmake/xtensa-lx106-elf.cmake
touch cmake/avr-none.cmake

touch cmake/src.cmake
touch cmake/syntax.cmake
touch cmake/install.cmake
touch cmake/clean.cmake
touch cmake/version.cmake

mkdir {hw,cpu,arch,os}/{inc,src}
touch {hw,cpu,arch,os}/{inc,src}/.gitignore

mkdir hw/{pc,f429disco,l496disco,f4disco,iskra,rpi800}/{inc,src}
touch hw/{pc,f429disco,l496disco,f4disco,iskra,rpi800}/{inc,src}/.gitignore
touch hw/pc/pc.{mk,cmake}
touch hw/f4disco/f4disco.{mk,cmake,ocd}
touch hw/f429disco/f4disco.{mk,cmake,ocd}
touch hw/l496disco/f4disco.{mk,cmake,ocd}
touch hw/iskra/f4disco.{mk,cmake,ocd}

mkdir cpu/{i5,i686,stm32f429zi,stm32f405rg,stm32f407vg,stm32f429zi,stm32l496ag,stm32f040f4,stm32f103c8}/{inc,src}
touch cpu/{i5,i686,stm32f429zi,stm32f405rg,stm32f407vg,stm32f429zi,stm32l496ag,stm32f040f4,stm32f103c8}/{inc,src}/.gitignore
touch cpu/i5/i5.{mk,cmake}

mkdir arch/{x86_64,i386,cortexm,cortexm0,cortexm3,cortexm4}/{inc,src}
touch arch/{x86_64,i386,cortexm,cortexm0,cortexm3,cortexm4}/{inc,src}/.gitignore
touch arch/x86_64/x86_64.{mk,cmake}

touch inc/byte.hpp src/byte.{cpp,ragel,lemon}

mkdir mk
touch mk/{doc,ref,gz,install}.mk
find mk >> Makefile
